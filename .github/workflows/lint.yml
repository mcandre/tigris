---
name: "Lint"
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"
jobs:
  Lint:
    runs-on: "ubuntu-24.04"
    env:
      GOPATH: "/home/runner/go"
    steps:
    - uses: "actions/checkout@v7"
    - uses: "actions/setup-go@v7"
      with:
        go-version: "1.27.0"
    - name: "provision dev tools"
      run: |
        sudo apt update
        sudo apt install -y shellcheck
    - name: "provision dev tools"
      run: "make -f install.mk"
    - run: "make lint"
